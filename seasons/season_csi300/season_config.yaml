      retain cash and positions across weeks; actual daily NAV and pointwise quantiles
      are saved, while weekly settlements define reporting segments. Earlier cutoffs
      and repeated daily or weekly reviews are descriptive monitoring. Correction
      does not cover all historical windows jointly or hidden prior research selection.
      Monte Carlo intervals measure simulation tail uncertainty and add no market
      history.</p>

      <p>Execution requires finite positive same-day quotes; missing-price sells retain
      the position. Valuation may carry the last valid close with stale-mark counts.
      Pool membership is separate from affordability. Decision-close intent is frozen
      before Monday execution. Taotie uses a 1.0 standard-account capital ratio and
      the same allocation policy. Ghost is a capital-granularity scenario, not a costless
      equal-weight index. Turnover is gross buys plus gross sells divided by starting
      assets.</p>

      <p>This remains daily-bar research: full-day volume is a retrospective tradability
      proxy. Complete verified corporate-action, opening direction-limit and capacity
      data are unavailable. Factor changes are not guessed into dividend payments,
      and adjusted prices are not mixed with unchanged nominal shares to claim a total-return
      repair. Strict execution fails its preflight without required coverage.</p>'
