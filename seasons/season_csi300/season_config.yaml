      <h2>Mechanisms and interpretation</h2>

      <p>The TopK=5/DropN=1 segment spread across contestants is 20.3381 percentage
      points. A winning concentrated path does not establish a universal concentration
      advantage. Rabbit DropN changes weekly replacement capacity, not trading frequency.
      Sloth delay and cold-start cash, and Snail warm-start stale signals, jointly
      alter exposure and path dependence; these are whole-strategy comparisons, not
      an identified prediction half-life. Percentile Meerkats and inverted Koala should
      be read against the full contestant distribution above.</p>

      <p>Contestant averages describe consistency across animals; the best row describes
      realized performance in this window. Pool membership, fees, lots, cash exposure
      and signal cross-sections all contribute to differences across environments.
      The results do not identify a single macro cause or disclose contestant architecture.</p>

      <h2>Random-control and execution contract</h2>

      <p>Matching uses TopK/DropN only: ten random specifications and one deterministic
      passive reference. Delay, warm/cold starts, inversion and percentile selection
      do not introduce extra species. The p values above test cumulative returns from
      inception, not segment returns. The upper tail includes ties: p=(k+1)/(N+1).
