# ==============================================================================
# QuantPits-Arena Season CSI 1000 Demo Configuration (season_config.yaml)
# ==============================================================================

season_id: season_csi1000
title: "QuantPits Arena Season CSI 1000 (Small-Cap Breadth Demo)"
status: DEMO
description: "CSI 1000 small-cap universe testbed: evaluating the 6 Alpha candidate models and 28 execution containers against CSI 1000 (SH000852) benchmark"

# Calendar and Horizon (Parallel Timeline with Season 1 for Direct Comparison)
calendar:
  anchor_date: "2026-07-03"        # Retrospective calibration anchor (Friday close)
  first_trade_date: "2026-07-06"   # Monday market open entry
  end_date: "2026-10-09"           # Tournament evaluation horizon
  cycle_freq: "weekly"

# Account and Match Execution Parameters
execution:
  initial_cash: 500000.0           # Standard baseline capital: CNY 500,000
  deal_price_mode: "open"          # Monday open execution
  lot_size: 100                    # 100 shares per lot
  allow_fractional_shares: false
  open_cost: 0.0005
  close_cost: 0.0015
  min_cost: 5.0
  topk: 22
  n_drop: 3

# Universe Definition
universe:
  provider: "manifest_feature_universe"
  market: "csi1000"
  name: "CSI 1000 Universe (~1000 Stocks)"
  market_benchmark_name: "CSI 1000"
  market_benchmark_symbol: "SH000852"
  testbed_desc: "1000-stock small-cap testbed"

banner:
  proof_text: "🔬 <strong style=\"color: var(--text-secondary);\">CSI 1000 Testbed Proof:</strong> 1,000 small-cap equities with 11,000 empirical random monkeys verified over 2026-07-03 ~ 2026-10-09. Unfalsifiable empirical null resolution."

# Enabled Benchmarks
benchmarks:
  - id: "taotie"
    type: "EXECUTABLE"
    initial_cash: 2000000.0          # Scaled for 1000-stock universe capacity (~2000 RMB / stock budget)
    display_name: "Taotie 1000 (CSI 1000 Executable 2M)"
  - id: "ghost_taotie"
    type: "THEORETICAL"
    initial_cash: 100000000.0      # Institutional CNY 100M capital
    display_name: "Ghost Taotie 1000 (Theoretical Equal-Weight 100M)"
  - id: "csi1000"
    type: "INDEX"
    symbol: "SH000852"
    display_name: "CSI 1000"
  - id: "monkeys"
    type: "STATISTICAL"
    colony_size_per_spec: 1000

