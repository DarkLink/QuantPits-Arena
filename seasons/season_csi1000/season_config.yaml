# Enabled Benchmarks
benchmarks:
  - id: "taotie"
    type: "EXECUTABLE"
    initial_cash: 2000000.0          # Scaled for 1000-stock universe capacity (~2000 RMB / stock budget)
    display_name: "Taotie 1000 (CSI 1000 Executable 2M)"
  - id: "ghost_taotie"
    type: "THEORETICAL"
    initial_cash: 100000000.0      # Institutional CNY 100M capital
    display_name: "Ghost Taotie 1000 (Theoretical Equal-Weight 100M)"
  - id: "csi1000"
    type: "INDEX"
    symbol: "SH000852"
    display_name: "CSI 1000"
  - id: "monkeys"
    type: "STATISTICAL"
    colony_size_per_spec: 1000

