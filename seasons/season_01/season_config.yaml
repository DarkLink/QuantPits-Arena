season_id: season_01
title: "QuantPits Graveyard Arena Season 1"
status: ACTIVE
description: "Season 1 baseline tournament: 6 contestant models x 29 zoo parameter arrays x parameterized monkey control group"

# Calendar and Horizon
calendar:
  anchor_date: "2026-07-03"        # Friday close initial decision cutoff (T=0)
  first_trade_date: "2026-07-06"   # Monday market open entry
  end_date: "2026-08-28"           # Data cutoff Friday settlement
  cycle_freq: "weekly"

# Account and Match Execution Parameters
execution:
  initial_cash: 500000.0           # Baseline capital: CNY 500,000
  deal_price_mode: "open"          # Monday open execution
  lot_size: 100                    # 100 shares per lot
  allow_fractional_shares: false   # No fractional shares
  open_cost: 0.0005                # Buy commission: 0.05%
  close_cost: 0.0015               # Sell commission + stamp tax: 0.15%
  min_cost: 5.0                    # Minimum ticket cost: CNY 5.0
  topk: 22                         # Default holding capacity
  n_drop: 3                        # Default weekly turnover capacity

# Universe Definition
universe:
  provider: "manifest_feature_universe"
  market: "csirun300"
  name: "Season 1 Constituent Universe (246 Stocks)"
  market_benchmark_name: "CSI 300"
  market_benchmark_symbol: "SH000300"
  benchmark_index: "SH000300"
  testbed_desc: "246-stock high-liquidity testbed"

banner:
  proof_text: "🔐 <strong style=\"color: var(--text-secondary);\">Proof of Timeliness:</strong> Next cycle (through 2026-09-04) cryptographically committed on 2026-09-05 (<code style=\"font-size: 10px; color: var(--brand-cyan);\">SHA-256: 8fca6717...</code>). Public reveal embargoed until 2026-09-11."

# Enabled Benchmarks (First-Class Citizens)
benchmarks:
