      <h2>Mechanisms and interpretation</h2>

      <p>The TopK=5/DropN=1 segment spread across contestants is 6.6959 percentage
      points. A winning concentrated path does not establish a universal concentration
      advantage. Rabbit DropN changes weekly replacement capacity, not trading frequency.
      Sloth delay and cold-start cash, and Snail warm-start stale signals, jointly
      alter exposure and path dependence; these are whole-strategy comparisons, not
      an identified prediction half-life. Percentile Meerkats and inverted Koala should
      be read against the full contestant distribution above.</p>

      <p>Contestant averages describe consistency across animals; the best row describes
      realized performance in this window. Pool membership, fees, lots, cash exposure
      and signal cross-sections all contribute to differences across environments.
      The results do not identify a single macro cause or disclose contestant architecture.</p>

      <h2>Random-control and execution contract</h2>

      <p>Matching uses TopK/DropN only: ten random specifications and one deterministic
      passive reference. Delay, warm/cold starts, inversion and percentile selection
      do not introduce extra species. The p values above test cumulative returns from
      inception, not segment returns. The upper tail includes ties: p=(k+1)/(N+1).
      At N=100,000, minimum p is 9.9999e-06, never zero. Bonferroni/Holm/BH/BY are
      stored separately. The 840-item raw threshold is 5.952381e-05, with strict inequality;
      at the formal count, up to four exceedances can pass Bonferroni. Earlier cutoffs
      and repeated weekly reviews are descriptive monitoring. Correction does not
      cover all historical windows jointly or hidden prior research selection. Monte
      Carlo intervals measure simulation tail uncertainty and add no market history.</p>

      <p>Execution requires finite positive same-day quotes; missing-price sells retain
      the position. Valuation may carry the last valid close with stale-mark counts.
      Pool membership is separate from affordability. Decision-close intent is frozen
      before Monday execution. Taotie uses a 1.0 standard-account capital ratio and
      the same allocation policy. Ghost is a capital-granularity scenario, not a costless
      equal-weight index. Turnover is gross buys plus gross sells divided by starting
      assets.</p>

      <p>This remains daily-bar research: full-day volume is a retrospective tradability
      proxy. Complete verified corporate-action, opening direction-limit and capacity
      data are unavailable. Factor changes are not guessed into dividend payments,
      and adjusted prices are not mixed with unchanged nominal shares to claim a total-return
      repair. Strict execution fails its preflight without required coverage.</p>'
