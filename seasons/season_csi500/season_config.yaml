# ==============================================================================
# QuantPits-Arena Season CSI 500 Configuration (season_config.yaml)
# ==============================================================================

season_id: season_csi500
title: "QuantPits Arena Season CSI 500 (Mid-Cap Breadth Season)"
status: ACTIVE
description: "CSI 500 mid-cap universe benchmark: evaluating the 6 Alpha candidate models and 28 execution containers against CSI 500 (SH000905) benchmark"

# Calendar and Horizon (Parallel Timeline with Season 1 for Direct Comparison)
calendar:
  anchor_date: "2026-07-03"        # Retrospective calibration anchor (Friday close)
  first_trade_date: "2026-07-06"   # Monday market open entry
  end_date: "2026-09-04"           # Tournament evaluation horizon
  cycle_freq: "weekly"

# Account and Match Execution Parameters
execution:
  initial_cash: 500000.0           # Standard baseline capital: CNY 500,000
  deal_price_mode: "open"          # Monday open execution
  lot_size: 100                    # 100 shares per lot
  allow_fractional_shares: false
  open_cost: 0.0005
  close_cost: 0.0015
  min_cost: 5.0
  topk: 22
  n_drop: 3

# Universe Definition
universe:
  provider: "manifest_feature_universe"
  market: "csi500"
  name: "CSI 500 Universe (~500 Stocks)"
  market_benchmark_name: "CSI 500"
  market_benchmark_symbol: "SH000905"
  testbed_desc: "500-stock mid-cap testbed"

banner:
  proof_text: "🔬 <strong style=\"color: var(--text-secondary);\">CSI 500 Testbed Proof:</strong> 500 mid-cap equities with 11,000 empirical random monkeys verified over 2026-07-03 ~ 2026-09-04. Unfalsifiable empirical null resolution."

# Enabled Benchmarks
benchmarks:
  - id: "taotie"
    type: "EXECUTABLE"
    initial_cash: 1000000.0          # Scaled for 500-stock universe capacity (~2000 RMB / stock budget)
    display_name: "Taotie 500 (CSI 500 Executable 1M)"
  - id: "ghost_taotie"
    type: "THEORETICAL"
    initial_cash: 100000000.0      # Institutional CNY 100M capital
    display_name: "Ghost Taotie 500 (Theoretical Equal-Weight 100M)"
  - id: "csi500"
    type: "INDEX"
    symbol: "SH000905"
    display_name: "CSI 500"
  - id: "monkeys"
    type: "STATISTICAL"
    colony_size_per_spec: 1000
